name: Release

# Push a version tag (for example 1.0.0) to build, test and publish that version.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub Release
      packages: write # publish to GitHub Packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the version comes from the tag

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Test
        run: ./gradlew :bowerbird-java-format-spi:check :bowerbird-java-format-jdk-bootstrap:check :bowerbird-java-format:check :bowerbird-maven-plugin:check --stacktrace

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew --stacktrace
          :bowerbird-java-format-spi:publishMavenPublicationToGitHubPackagesRepository
          :bowerbird-java-format-jdk-bootstrap:publishMavenPublicationToGitHubPackagesRepository
          :bowerbird-java-format:publishMavenPublicationToGitHubPackagesRepository
          :bowerbird-maven-plugin:publishMavenPublicationToGitHubPackagesRepository

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            bowerbird-java-format/build/libs/*.jar
            bowerbird-java-format-spi/build/libs/*.jar
            bowerbird-java-format-jdk-bootstrap/build/libs/*.jar
