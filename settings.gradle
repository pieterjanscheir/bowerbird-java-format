buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.palantir.gradle.jdks:gradle-jdks-settings:0.86.0'
    }
}
apply plugin: 'com.palantir.jdks.settings'
rootProject.name = 'bowerbird-java-format-parent'

include ':gradle-bowerbird-java-format'
include ':eclipse_plugin'
include ':idea-plugin'
include ':bowerbird-java-format-spi'
include ':bowerbird-java-format'
include ':bowerbird-java-format-jdk-bootstrap'
include ':bowerbird-java-format-benchmarks'
include ':bowerbird-java-format-native'
include ':bowerbird-maven-plugin'

boolean isCiServer = System.getenv().containsKey('CI')
buildCache {
    local {
        enabled = !isCiServer
    }
}
